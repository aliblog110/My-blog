<!DOCTYPE html>
<html dir="rtl" lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIP Admin - Sadaye Imam</title>
<style>
body{background:#0f172a; color:white; font-family:sans-serif; padding:15px}
.box{max-width:650px; margin:auto; background:white; color:black; padding:20px; border-radius:15px}
select,input,textarea{width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:15px}
button{width:100%; padding:14px; background:#16a34a; color:white; border:none; border-radius:8px; font-size:18px; font-weight:bold; margin-top:10px}
#out{display:none; margin-top:15px; background:#f1f5f9; padding:10px; border-radius:8px}
</style>
</head>
<body>
<div class="box">
<h2>🟢 Anjuman VIP Admin</h2>

<label>Post ka Type:</label>
<select id="type" onchange="show()">
<option value="news">1 - Khabar (Image + Likhai)</option>
<option value="pdf">2 - PDF File</option>
<option value="album">3 - Photo Album</option>
</select>

<div id="f_news">
<input id="t1" placeholder="Khabar ka Title">
<textarea id="d1" rows="5" placeholder="Khabar ki tafseel likho"></textarea>
<input id="i1" placeholder="Image ka Link (https://...)">
</div>

<div id="f_pdf" style="display:none">
<input id="t2" placeholder="PDF ka Title likho">
<input id="l2" placeholder="PDF ka Link yahan paste karo">
</div>

<div id="f_album" style="display:none">
<input id="t3" placeholder="Album ka Title">
<textarea id="l3" rows="6" placeholder="Har Photo ka Link alag line me likho"></textarea>
</div>

<button onclick="make()">CODE BANAO</button>

<div id="out">
<b>Ye Code Copy Karo aur index.html me paste karo:</b>
<textarea id="code" rows="10" style="width:100%"></textarea>
</div>

</div>

<script>
function show(){
let v=document.getElementById("type").value;
document.getElementById("f_news").style.display=v=="news"?"block":"none";
document.getElementById("f_pdf").style.display=v=="pdf"?"block":"none";
document.getElementById("f_album").style.display=v=="album"?"block":"none";
}
function make(){
let v=document.getElementById("type").value;
let html="";
if(v=="news"){
let t=document.getElementById("t1").value;
let d=document.getElementById("d1").value;
let i=document.getElementById("i1").value;
html=`<div style="background:white;margin:15px;padding:15px;border-radius:12px;border-right:5px solid green"><h3>${t}</h3>${i?`<img src="${i}" style="width:100%;border-radius:10px">`:''}<p>${d}</p></div>`;
}
if(v=="pdf"){
let t=document.getElementById("t2").value;
let l=document.getElementById("l2").value;
html=`<div style="background:white;margin:15px;padding:15px;border-radius:12px;border-right:5px solid red"><h3>📄 ${t}</h3><a href="${l}" target="_blank" style="background:red;color:white;padding:10px 15px;border-radius:8px;text-decoration:none;display:inline-block">PDF Kholo / Download Karo</a></div>`;
}
if(v=="album"){
let t=document.getElementById("t3").value;
let links=document.getElementById("l3").value.split("\n");
let imgs=links.map(x=>`<img src="${x.trim()}" style="width:48%;margin:1%;border-radius:8px">`).join("");
html=`<div style="background:white;margin:15px;padding:15px;border-radius:12px;border-right:5px solid blue"><h3>📸 ${t}</h3><div style="display:flex;flex-wrap:wrap">${imgs}</div></div>`;
}
document.getElementById("code").value=html;
document.getElementById("out").style.display="block";
}
</script>
</body>
</html>
